<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediaPlayer</title>
    <base href="/" />

    <!-- Bootstrap 5 (template-shipped, unmodified) -->
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />

    <!-- Blazorise styles for the Bootstrap 5 provider -->
    <link rel="stylesheet" href="_content/Blazorise.Bootstrap5/blazorise.bootstrap5.css" />

    <!-- FontAwesome icons used by Blazorise.Icons.FontAwesome -->
    <link rel="stylesheet" href="_content/Blazorise.Icons.FontAwesome/v6/css/all.min.css" />

    <link rel="icon" type="image/png" href="favicon.png" />
</head>

<body>
    <div id="app" class="d-flex flex-column align-items-center justify-content-center min-vh-100 bg-light">
        <div class="spinner-border text-primary" style="width:3rem;height:3rem;" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <div class="mt-3 text-muted fw-semibold">Loading MediaPlayer…</div>
    </div>

    <div id="blazor-error-ui"
         style="display:none;position:fixed;bottom:0;left:0;right:0;padding:0.6rem 1rem;background:#ffe082;border-top:1px solid #b59f3b;z-index:1100;font-family:system-ui,sans-serif;">
        An unhandled error has occurred.
        <a href="" class="reload" style="margin-left:0.5rem;color:#0d47a1;">Reload</a>
        <a class="dismiss" style="float:right;cursor:pointer;">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
